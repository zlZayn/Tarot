# 本地提交钩子：只跑「秒级」检查，能自动修的直接修；修不掉的才拦下提交。
#
# 本仓是 TS + Python 双栈，钩子因此分两组：
#   - 前端（npm + prettier/eslint）：`npx --no-install`，只认仓内 node_modules，**不联网下载**
#   - Python（uv + ruff）：`uv run`，版本来自 pyproject 的 dev 组，锁在 uv.lock
#
# 设计取舍：
#   - 只跑格式化与 lint（秒级）。typecheck / 前端构建 / python 的 run_checks+run_e2e
#     留给 CI 与 release.yml —— 钩子一慢就会有人用 --no-verify 绕过，等于没有钩子。
#   - 自动修复（--write / --fix / ruff format）会让文件在工作树里变化，**需要重新 git add**。
#
# 启用（每个 clone 执行一次；pre-commit 本体用 `uv tool install pre-commit` 装到 ~/.local/bin）：
#   pre-commit install
# 全量跑一次：
#   pre-commit run --all-files
# 临时跳过：
#   git commit --no-verify
#
# 边界：本文件不改 core.hooksPath，也不覆盖 .git/hooks 下已有的占位钩子；
# pre-commit 只会写入 .git/hooks/pre-commit（本仓此前不存在该文件）。
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix (uv)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff format (uv)
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true

      - id: prettier
        name: prettier --write (npx --no-install)
        entry: npx --no-install prettier --write
        language: system
        files: \.(ts|tsx|js|jsx|mjs|cjs|json|css|scss|html|yml|yaml)$
        exclude: ^(node_modules/|dist/|package-lock\.json$|pnpm-lock\.yaml$)
        require_serial: true

      - id: eslint
        name: eslint --fix (npx --no-install)
        entry: npx --no-install eslint --fix
        language: system
        files: \.(ts|tsx|js|jsx|mjs|cjs)$
        exclude: ^(node_modules/|dist/)
        require_serial: true
